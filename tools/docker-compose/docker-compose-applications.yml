version: '3.6'
services:
  write-api-server-1:
    command: ["writeApi"]
    image: cqrs-es-example-go:latest
    container_name: write-api-server-1
    ports:
      - 28080:8080
    environment:
      AWS_REGION: ${AWS_REGION}
      API_HOST: "0.0.0.0"
      API_PORT: 8080
      API_ALLOW_ORIGINS: "http://localhost:28080,http://localhost:28082,http://localhost:8888"
      PERSISTENCE_JOURNAL_TABLE_NAME: journal
      PERSISTENCE_SNAPSHOT_TABLE_NAME: snapshot
      PERSISTENCE_HEAD_TABLE_NAME: head
      PERSISTENCE_SNAPSHOT_HISTORY_INDEX_NAME: snapshot-history
      PERSISTENCE_SNAPSHOT_INTERVAL: 10
      AWS_REGION_NAME: ${AWS_REGION}
      AWS_DYNAMODB_ENDPOINT_URL: http://localstack:4566
      AWS_DYNAMODB_ACCESS_KEY_ID: x
      AWS_DYNAMODB_SECRET_ACCESS_KEY: x
    depends_on:
      localstack:
        condition: service_started
      dynamodb-admin:
        condition: service_started
      dynamodb-setup:
        condition: service_completed_successfully
  read-model-updater-1:
    command: [ "localRmu" ]
    image: cqrs-es-example-go:latest
    container_name: read-model-updater-1
    ports:
      - 28081:8080
    environment:
      AWS_REGION: ${AWS_REGION}
      API_HOST: "0.0.0.0"
      API_PORT: 8080
      AWS_REGION_NAME: ${AWS_REGION}
      AWS_DYNAMODB_ENDPOINT_URL: http://localstack:4566
      AWS_DYNAMODB_ACCESS_KEY_ID: x
      AWS_DYNAMODB_SECRET_ACCESS_KEY: x
      STREAM_HEAD_TABLE_NAME: head
      STREAM_JOURNAL_TABLE_NAME: journal
      STREAM_MAX_ITEM_COUNT: 32
      DATABASE_URL: ceer:ceer@tcp(mysql-local:3306)/ceer
    depends_on:
      mysql:
        condition: service_healthy
      migration:
        condition: service_completed_successfully
      localstack:
        condition: service_started
      dynamodb-admin:
        condition: service_started
      dynamodb-setup:
        condition: service_completed_successfully
    restart: on-failure
  read-api-server-1:
    command: [ "readApi" ]
    image: cqrs-es-example-go:latest
    container_name: read-api-server-1
    ports:
      - 28082:8080
    environment:
      AWS_REGION: ${AWS_REGION}
      API_HOST: "0.0.0.0"
      API_PORT: 8080
      API_ALLOW_ORIGINS: "http://localhost:28080,http://localhost:18082,http://localhost:8888"
      DATABASE_URL: ceer:ceer@tcp(mysql-local:3306)/ceer
    depends_on:
      - mysql
      - migration
      - write-api-server-1
      - read-model-updater-1
  # recovery-worker runs the same handler as the Lambda recovery worker outside
  # Lambda. The startup pass models the SQS OnFailure notification and the
  # interval models the EventBridge schedule that replays pending tasks.
  recovery-worker:
    command: [ "localRecoveryWorker" ]
    image: cqrs-es-example-go:latest
    container_name: recovery-worker
    environment:
      AWS_REGION: ${AWS_REGION}
      AWS_ENDPOINT_URL: http://localstack:4566
      AWS_ACCESS_KEY_ID: x
      AWS_SECRET_ACCESS_KEY: x
      DATABASE_URL: ceer:ceer@tcp(mysql-local:3306)/ceer
      PERSISTENCE_JOURNAL_TABLE_NAME: journal
      PERSISTENCE_HEAD_TABLE_NAME: head
      PERSISTENCE_MAX_EVENTS_PER_TRANSACTION: 1
      RECOVERY_MAX_TASKS_PER_PASS: 10
      RECOVERY_WORKER_INTERVAL: 2s
    depends_on:
      mysql:
        condition: service_healthy
      migration:
        condition: service_completed_successfully
      localstack:
        condition: service_started
      dynamodb-setup:
        condition: service_completed_successfully
    restart: on-failure
