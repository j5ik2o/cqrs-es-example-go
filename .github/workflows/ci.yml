name: CI
on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
    # A PR can be retargeted to main without changing its head commit. Run
    # the same checks on every edit so an edit cannot publish skipped jobs.
    types: [opened, synchronize, reopened, edited]
jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Wait for fixture cancellation
        run: sleep 600
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-go@v7
        with:
          go-version: '1.27'
      - name: Install staticcheck
        run: |
          go install honnef.co/go/tools/cmd/staticcheck@v0.8.2
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
      - name: Run go vet
        run: make vet
      - name: Run staticcheck
        run: make lint
  test:
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-go@v7
        with:
          go-version: '1.27'
      - run: make test
  e2e:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-go@v7
        with:
          go-version: '1.27'
      - name: Run E2E tests
        run: make docker-compose-ci
      - name: Show logs on failure
        if: failure()
        run: |
          docker compose -p cqrs-es-example-go \
            -f tools/docker-compose/docker-compose-databases.yml \
            -f tools/docker-compose/docker-compose-applications.yml \
            -f tools/docker-compose/docker-compose-e2e-test.yml \
            logs --no-color --tail=200
  aislop:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-go@v7
        with:
          go-version: '1.27'
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Run aislop check
        run: npm run check:aislop
      - name: Run aislop tests
        run: npm run test:aislop
  required-ci:
    name: Required CI
    runs-on: ubuntu-latest
    permissions: {}
    needs: [lint, test, e2e, aislop]
    if: ${{ always() }}
    steps:
      - name: Require all CI jobs to succeed
        shell: bash
        env:
          LINT_RESULT: ${{ needs.lint.result }}
          TEST_RESULT: ${{ needs.test.result }}
          E2E_RESULT: ${{ needs.e2e.result }}
          AISLOP_RESULT: ${{ needs.aislop.result }}
        run: |
          failed=0
          for job in LINT TEST E2E AISLOP; do
            result_var="${job}_RESULT"
            result="${!result_var}"
            if [[ "$result" != success ]]; then
              printf '::error::%s result: %s (expected success)\n' "$job" "${result:-missing}"
              failed=1
            fi
          done
          exit "$failed"
