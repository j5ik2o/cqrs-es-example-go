name: CI
on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
    # A PR can be retargeted to main without changing its head commit. Run
    # the same checks on every edit so an edit cannot publish skipped jobs.
    types: [opened, synchronize, reopened, edited]
jobs:
  checkout-revision:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      ref: ${{ steps.resolve.outputs.checkout_ref }}
      test_merge: ${{ steps.resolve.outputs.test_merge }}
      bundle: ${{ steps.resolve.outputs.bundle_name }}
    steps:
      - uses: actions/checkout@v7
        if: ${{ github.event_name == 'pull_request' }}
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Test the test merge resolution
        if: ${{ github.event_name == 'pull_request' }}
        run: node --test .github/scripts/pr-test-merge.test.mjs
      # Check the current base tip and PR head, not the event's base SHA.
      - name: Resolve the PR's test merge
        id: resolve
        if: ${{ github.event_name == 'pull_request' }}
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
          EVENT_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          GH_TOKEN: ${{ github.token }}
        run: .github/scripts/pr-test-merge.sh
      - uses: actions/upload-artifact@v7
        if: ${{ steps.resolve.outputs.bundle_name != '' }}
        with:
          name: ${{ steps.resolve.outputs.bundle_name }}
          path: ${{ runner.temp }}/pr-test-merge.bundle
          if-no-files-found: error
          retention-days: 1
  lint:
    runs-on: ubuntu-latest
    needs: checkout-revision
    steps:
      - &checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.checkout-revision.outputs.ref }}
          # The bundle of a locally built test merge needs the base history.
          fetch-depth: ${{ needs.checkout-revision.outputs.bundle != '' && '0' || '1' }}
          persist-credentials: false
      - &download-test-merge
        uses: actions/download-artifact@v7
        if: ${{ needs.checkout-revision.outputs.bundle != '' }}
        with:
          name: ${{ needs.checkout-revision.outputs.bundle }}
          path: ${{ runner.temp }}/pr-test-merge
      - &verify-test-merge
        name: Verify the checked out test merge
        if: ${{ github.event_name == 'pull_request' }}
        shell: bash
        env:
          TEST_MERGE: ${{ needs.checkout-revision.outputs.test_merge }}
          BUNDLE: ${{ needs.checkout-revision.outputs.bundle }}
        run: |
          if [[ -n "$BUNDLE" ]]; then
            git fetch --quiet --no-tags "$RUNNER_TEMP/pr-test-merge/pr-test-merge.bundle" refs/pr-ci/merge
            git checkout --quiet --detach FETCH_HEAD
          fi
          actual=$(git show -s --format='%H %P' HEAD)
          printf 'Checked out test merge (SHA, base, head): %s\n' "$actual"
          if [[ -z "$TEST_MERGE" || "$actual" != "$TEST_MERGE" ]]; then
            printf '::error::Expected test merge %s\n' "${TEST_MERGE:-missing}"
            exit 1
          fi
      - uses: actions/setup-go@v7
        with:
          go-version: '1.27'
      - name: Install staticcheck
        run: |
          go install honnef.co/go/tools/cmd/staticcheck@v0.8.2
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
      - name: Run go vet
        run: make vet
      - name: Run staticcheck
        run: make lint
  test:
    runs-on: ubuntu-latest
    needs: [lint, checkout-revision]
    steps:
      - *checkout
      - *download-test-merge
      - *verify-test-merge
      - uses: actions/setup-go@v7
        with:
          go-version: '1.27'
      - run: make test
  e2e:
    runs-on: ubuntu-latest
    needs: [test, checkout-revision]
    steps:
      - *checkout
      - *download-test-merge
      - *verify-test-merge
      - uses: actions/setup-go@v7
        with:
          go-version: '1.27'
      - name: Run E2E tests
        run: make docker-compose-ci
      - name: Show logs on failure
        if: failure()
        run: |
          docker compose -p cqrs-es-example-go \
            -f tools/docker-compose/docker-compose-databases.yml \
            -f tools/docker-compose/docker-compose-applications.yml \
            -f tools/docker-compose/docker-compose-e2e-test.yml \
            logs --no-color --tail=200
  aislop:
    runs-on: ubuntu-latest
    needs: checkout-revision
    steps:
      - *checkout
      - *download-test-merge
      - *verify-test-merge
      - uses: actions/setup-go@v7
        with:
          go-version: '1.27'
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Run aislop check
        run: npm run check:aislop
      - name: Run aislop tests
        run: npm run test:aislop
  required-ci:
    name: Required CI
    runs-on: ubuntu-latest
    permissions: {}
    needs: [checkout-revision, lint, test, e2e, aislop]
    if: ${{ always() }}
    steps:
      - name: Require all CI jobs to succeed
        shell: bash
        env:
          CHECKOUT_RESULT: ${{ needs.checkout-revision.result }}
          LINT_RESULT: ${{ needs.lint.result }}
          TEST_RESULT: ${{ needs.test.result }}
          E2E_RESULT: ${{ needs.e2e.result }}
          AISLOP_RESULT: ${{ needs.aislop.result }}
        run: |
          failed=0
          for job in CHECKOUT LINT TEST E2E AISLOP; do
            result_var="${job}_RESULT"
            result="${!result_var}"
            if [[ "$result" != success ]]; then
              printf '::error::%s result: %s (expected success)\n' "$job" "${result:-missing}"
              failed=1
            fi
          done
          exit "$failed"
